<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PETMATCH - Tu tienda de paquetes para mascotas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f4f8;
    }

    header {
      background-color: #007BFF;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
    }

    header img {
      height: 100px;
      margin-right: 15px;
    }

    header h1 {
      font-size: 24px;
      margin: 0;
    }

    .catalogo {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .paquete {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .paquete:hover {
      transform: scale(1.03);
    }

    .paquete img {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }

    .paquete-content {
      padding: 15px;
    }

    .paquete h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .paquete p {
      margin: 5px 0;
    }

    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 32px;
      background-color: #25d366;
      color: white;
      padding: 10px 14px;
      border-radius: 50%;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .whatsapp:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header>
    <img src="logo.png" alt="Logo PETMATCH" />
    <h1>PETMATCH - Más que moda, un vínculo</h1>
  </header>

  <!-- Catálogo de Paquetes -->
  <section class="catalogo">
    <div class="paquete" onclick="abrirFormulario('DEPORTIVO')">
      <img src="deportivo.jpg" alt="Paquete Deportivo" />
      <div class="paquete-content">
        <h2>DEPORTIVO</h2>
        <p>Incluye arnés ligero, pelota con cuerda y bebedero portátil.</p>
        <p><strong>Precio:</strong> $350</p>
      </div>
    </div>

    <div class="paquete" onclick="abrirFormulario('VERANO')">
      <img src="verano.jpg" alt="Paquete Verano" />
      <div class="paquete-content">
        <h2>VERANO</h2>
        <p>Gafas solares para perro, pañuelo refrescante y crema para patas.</p>
        <p><strong>Precio:</strong> $420</p>
      </div>
    </div>

    <div class="paquete" onclick="abrirFormulario('INVIERNO')">
      <img src="invierno.jpg" alt="Paquete Invierno" />
      <div class="paquete-content">
        <h2>INVIERNO</h2>
        <p>Abrigo térmico, botas antideslizantes y manta suave.</p>
        <p><strong>Precio:</strong> $480</p>
      </div>
    </div>
  </section>

  <!-- Botón WhatsApp -->
  <a href="https://wa.me/5215542009790" class="whatsapp" target="_blank" title="Contáctanos por WhatsApp">💬</a>

  <!-- Script para redirigir al formulario -->
  <script>
    function abrirFormulario(paquete) {
      window.location.href = "formulario.html?paquete=" + encodeURIComponent(paquete);
    }
  </script>
</body>
</html>
